name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.ruby == 'ruby-head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", ruby-head]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify action dependencies
        if: matrix.ruby == '4.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: latest
      - run: bundle install
      - run: bundle exec rake test

  publish:
    name: Publish gem
    needs: test
    if: github.repository == 'knu/webrobots' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/webrobots/versions/${{ steps.gem.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: "4.0"
          bundler: latest
      - run: bundle install
      - name: Check release version
        id: gem
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle exec ruby -e '
            require "webrobots/version"
            version = Webrobots::VERSION
            abort "tag does not match gem version" unless ENV.fetch("RELEASE_TAG") == "v#{version}"
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |f| f.puts "version=#{version}" }
          '
      - name: Build gem
        run: bundle exec rake build
      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1.4.1
        with:
          await-release: false
